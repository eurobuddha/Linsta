<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linsta — Linternet Post Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="jszip.min.js"></script>
<style>
:root {
  --bg: #FAF8F5;
  --bg-warm: #F3EFE9;
  --surface: #FFFEFB;
  --ink: #1A1A18;
  --ink-soft: #5C5A55;
  --ink-muted: #9E9B94;
  --accent: #D4583A;
  --accent-glow: rgba(212, 88, 58, 0.15);
  --border: #E5E0D8;
  --border-focus: #C8C1B6;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 3px rgba(26,26,24,0.04), 0 1px 2px rgba(26,26,24,0.06);
  --shadow-md: 0 4px 16px rgba(26,26,24,0.06), 0 2px 6px rgba(26,26,24,0.04);
  --shadow-lg: 0 12px 40px rgba(26,26,24,0.08), 0 4px 12px rgba(26,26,24,0.04);
  --font-body: 'Manrope', system-ui, sans-serif;
  --font-display: 'DM Serif Display', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  padding: 24px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.logo {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: -0.5px;
  color: var(--ink);
}

.logo span {
  color: var(--accent);
}

.tagline {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* ── Layout ── */
.studio {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 0;
  max-width: 1200px;
  margin: 0 auto;
  min-height: calc(100vh - 77px);
}

/* ── Controls Panel ── */
.controls {
  padding: 32px 36px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ink-muted);
  margin-bottom: 10px;
}

/* ── Upload Zone ── */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 48px 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s ease;
  background: var(--surface);
  position: relative;
  overflow: hidden;
}

.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-glow);
}

.upload-zone.has-image {
  padding: 0;
  border-style: solid;
  border-color: var(--border);
}

.upload-zone.has-image:hover {
  border-color: var(--accent);
}

.upload-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--bg-warm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--ink-soft);
}

.upload-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}

.upload-hint {
  font-size: 13px;
  color: var(--ink-muted);
}

.upload-zone img {
  width: 100%;
  display: block;
  border-radius: 10px;
}

#file-input { display: none; }

/* ── Image Controls ── */
.image-controls {
  display: none;
  gap: 16px;
}

.image-controls.visible {
  display: flex;
  flex-direction: column;
}

.slider-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.slider-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  min-width: 70px;
}

.slider-value {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-muted);
  min-width: 36px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}

/* ── Crop Buttons ── */
.crop-options {
  display: flex;
  gap: 8px;
}

.crop-btn {
  flex: 1;
  padding: 10px 0;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
}

.crop-btn:hover {
  border-color: var(--border-focus);
  color: var(--ink);
}

.crop-btn.active {
  border-color: var(--ink);
  color: var(--ink);
  background: var(--bg-warm);
}

/* ── Text Inputs ── */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field label {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
}

.field input, .field textarea {
  font-family: var(--font-body);
  font-size: 15px;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s ease;
  resize: none;
}

.field input:focus, .field textarea:focus {
  border-color: var(--ink);
}

.field input::placeholder, .field textarea::placeholder {
  color: var(--ink-muted);
}

.field textarea {
  min-height: 80px;
}

.char-count {
  font-size: 11px;
  color: var(--ink-muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ── Filter Selector ── */
.filters {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.filter-btn {
  aspect-ratio: 1;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.2s ease;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 6px;
}

.filter-btn:hover {
  border-color: var(--border-focus);
}

.filter-btn.active {
  border-color: var(--ink);
  border-width: 2px;
}

.filter-btn .filter-preview {
  position: absolute;
  inset: 0;
  background: var(--bg-warm);
}

.filter-btn .filter-name {
  position: relative;
  z-index: 1;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  text-shadow: 0 1px 3px rgba(255,255,255,0.8);
}

/* ── Style Selector ── */
.styles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.style-btn {
  padding: 12px 8px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  text-align: center;
  transition: all 0.2s ease;
}

.style-btn:hover { border-color: var(--border-focus); }

.style-btn.active {
  border-color: var(--ink);
  background: var(--bg-warm);
}

.style-btn .style-icon {
  font-size: 20px;
  margin-bottom: 4px;
}

.style-btn .style-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-soft);
}

/* ── Generate Button ── */
.generate-btn {
  padding: 16px 32px;
  border: none;
  border-radius: var(--radius);
  background: var(--ink);
  color: #fff;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.3px;
  margin-top: auto;
  box-shadow: var(--shadow-md);
}

.generate-btn:hover {
  background: #2D2D2A;
  box-shadow: var(--shadow-lg);
  transform: translateY(-1px);
}

.generate-btn:active {
  transform: translateY(0);
}

.generate-btn:disabled {
  background: var(--border);
  color: var(--ink-muted);
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

.size-estimate {
  text-align: center;
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: -20px;
}

.size-estimate .size-bar {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}

.size-estimate .size-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
  transition: width 0.3s ease;
}

/* ── Preview Panel ── */
.preview-panel {
  background: var(--bg-warm);
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  position: sticky;
  top: 0;
  height: calc(100vh - 77px);
  overflow-y: auto;
}

.preview-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ink-muted);
  align-self: flex-start;
}

.preview-frame {
  width: 100%;
  max-width: 340px;
  background: #fff;
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transition: all 0.3s ease;
}

.preview-empty {
  padding: 80px 32px;
  text-align: center;
}

.preview-empty-icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.4;
}

.preview-empty-text {
  font-size: 14px;
  color: var(--ink-muted);
  line-height: 1.6;
}

/* ── Preview Post Styles ── */
.post-image-wrap {
  width: 100%;
  position: relative;
  overflow: hidden;
  background: #f0f0f0;
}

.post-image-wrap img {
  width: 100%;
  display: block;
}

.post-body {
  padding: 20px;
}

.post-author {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
}

.post-caption {
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-soft);
}

.post-date {
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Post style: Polaroid */
.preview-frame.style-polaroid {
  padding: 16px 16px 48px;
  border-radius: 4px;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.04);
}

.preview-frame.style-polaroid .post-image-wrap {
  border-radius: 0;
}

.preview-frame.style-polaroid .post-body {
  padding: 16px 4px 0;
  text-align: center;
}

.preview-frame.style-polaroid .post-caption {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 16px;
  color: var(--ink);
}

.preview-frame.style-polaroid .post-author,
.preview-frame.style-polaroid .post-date {
  display: none;
}

/* Post style: Editorial */
.preview-frame.style-editorial {
  border-radius: 0;
  border: 1px solid var(--ink);
}

.preview-frame.style-editorial .post-body {
  padding: 24px 20px;
  border-top: 3px solid var(--ink);
}

.preview-frame.style-editorial .post-author {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}

.preview-frame.style-editorial .post-caption {
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1.4;
  color: var(--ink);
}

.preview-frame.style-editorial .post-date {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

/* Post style: Minimal */
.preview-frame.style-minimal {
  background: transparent;
  box-shadow: none;
  border-radius: 0;
}

.preview-frame.style-minimal .post-image-wrap {
  border-radius: var(--radius);
}

.preview-frame.style-minimal .post-body {
  padding: 14px 2px;
}

.preview-frame.style-minimal .post-caption {
  font-size: 13px;
  color: var(--ink-muted);
}

/* Post style: Film */
.preview-frame.style-film {
  background: #1A1A18;
  border-radius: 4px;
  padding: 4px;
}

.preview-frame.style-film .post-image-wrap {
  border-radius: 2px;
}

.preview-frame.style-film .post-body {
  padding: 14px 12px;
}

.preview-frame.style-film .post-author {
  color: #C8C1B6;
  font-size: 11px;
}

.preview-frame.style-film .post-caption {
  color: #9E9B94;
  font-size: 13px;
}

.preview-frame.style-film .post-date {
  color: #5C5A55;
}

/* Post style: Stamp */
.preview-frame.style-stamp {
  background: var(--surface);
  border: 2px dashed var(--border);
  border-radius: 4px;
  padding: 12px;
}

.preview-frame.style-stamp .post-image-wrap {
  border-radius: 2px;
}

.preview-frame.style-stamp .post-body {
  padding: 14px 4px 4px;
  text-align: center;
}

.preview-frame.style-stamp .post-caption {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
}

/* ── Responsive ── */
@media (max-width: 800px) {
  .studio {
    grid-template-columns: 1fr;
  }
  .preview-panel {
    position: relative;
    height: auto;
    padding: 24px;
  }
  header { padding: 20px 24px; }
  .controls { padding: 24px; }
  .tagline { display: none; }
}

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.controls > * {
  animation: fadeUp 0.4s ease both;
}

.controls > *:nth-child(1) { animation-delay: 0.05s; }
.controls > *:nth-child(2) { animation-delay: 0.1s; }
.controls > *:nth-child(3) { animation-delay: 0.15s; }
.controls > *:nth-child(4) { animation-delay: 0.2s; }
.controls > *:nth-child(5) { animation-delay: 0.25s; }
.controls > *:nth-child(6) { animation-delay: 0.3s; }
.controls > *:nth-child(7) { animation-delay: 0.35s; }
.controls > *:nth-child(8) { animation-delay: 0.4s; }
.controls > *:nth-child(9) { animation-delay: 0.45s; }
</style>
</head>
<body>

<header>
  <div class="logo">L<span>i</span>nsta</div>
  <div class="tagline">Linternet Post Studio</div>
</header>

<div class="studio">
  <div class="controls">

    <!-- Upload -->
    <div>
      <div class="section-label">Photo</div>
      <div class="upload-zone" id="upload-zone">
        <div class="upload-icon">+</div>
        <div class="upload-text">Drop an image or click to upload</div>
        <div class="upload-hint">JPG, PNG, WebP — will be compressed for the Linternet</div>
      </div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <!-- Image Controls -->
    <div class="image-controls" id="image-controls">
      <div class="section-label">Crop</div>
      <div class="crop-options">
        <button class="crop-btn active" data-crop="original">Original</button>
        <button class="crop-btn" data-crop="1:1">1 : 1</button>
        <button class="crop-btn" data-crop="4:5">4 : 5</button>
        <button class="crop-btn" data-crop="16:9">16 : 9</button>
      </div>
      <div class="slider-row">
        <span class="slider-label">Quality</span>
        <input type="range" id="quality-slider" min="20" max="95" value="75">
        <span class="slider-value" id="quality-value">75%</span>
      </div>
    </div>

    <!-- Filter -->
    <div>
      <div class="section-label">Filter</div>
      <div class="filters">
        <button class="filter-btn active" data-filter="none">
          <div class="filter-preview" style="background:#eee;"></div>
          <span class="filter-name">None</span>
        </button>
        <button class="filter-btn" data-filter="warm">
          <div class="filter-preview" style="background:linear-gradient(135deg,#f5d0b0,#e8b88a);"></div>
          <span class="filter-name">Warm</span>
        </button>
        <button class="filter-btn" data-filter="cool">
          <div class="filter-preview" style="background:linear-gradient(135deg,#b0c4de,#8faabe);"></div>
          <span class="filter-name">Cool</span>
        </button>
        <button class="filter-btn" data-filter="bw">
          <div class="filter-preview" style="background:linear-gradient(135deg,#999,#555);"></div>
          <span class="filter-name">B&W</span>
        </button>
        <button class="filter-btn" data-filter="sepia">
          <div class="filter-preview" style="background:linear-gradient(135deg,#d4a76a,#c49a6c);"></div>
          <span class="filter-name">Sepia</span>
        </button>
        <button class="filter-btn" data-filter="vivid">
          <div class="filter-preview" style="background:linear-gradient(135deg,#ff8a80,#82b1ff);"></div>
          <span class="filter-name">Vivid</span>
        </button>
        <button class="filter-btn" data-filter="fade">
          <div class="filter-preview" style="background:linear-gradient(135deg,#ddd,#bbb);opacity:0.7;"></div>
          <span class="filter-name">Fade</span>
        </button>
        <button class="filter-btn" data-filter="noir">
          <div class="filter-preview" style="background:linear-gradient(135deg,#333,#111);"></div>
          <span class="filter-name">Noir</span>
        </button>
      </div>
    </div>

    <!-- Style -->
    <div>
      <div class="section-label">Post Style</div>
      <div class="styles">
        <button class="style-btn active" data-style="classic">
          <div class="style-icon">&#9634;</div>
          <div class="style-name">Classic</div>
        </button>
        <button class="style-btn" data-style="polaroid">
          <div class="style-icon">&#9635;</div>
          <div class="style-name">Polaroid</div>
        </button>
        <button class="style-btn" data-style="editorial">
          <div class="style-icon">&#9776;</div>
          <div class="style-name">Editorial</div>
        </button>
        <button class="style-btn" data-style="minimal">
          <div class="style-icon">&#9723;</div>
          <div class="style-name">Minimal</div>
        </button>
        <button class="style-btn" data-style="film">
          <div class="style-icon">&#9724;</div>
          <div class="style-name">Film</div>
        </button>
        <button class="style-btn" data-style="stamp">
          <div class="style-icon">&#9878;</div>
          <div class="style-name">Stamp</div>
        </button>
      </div>
    </div>

    <!-- Caption -->
    <div class="field">
      <div class="section-label">Caption</div>
      <textarea id="caption" placeholder="Write something..." maxlength="500"></textarea>
      <div class="char-count"><span id="char-count">0</span> / 500</div>
    </div>

    <!-- Author -->
    <div class="field">
      <label>Author</label>
      <input type="text" id="author" placeholder="Your name" maxlength="60">
    </div>

    <!-- Size Estimate -->
    <div class="size-estimate" id="size-estimate" style="display:none;">
      Estimated size: <strong id="size-value">0 KB</strong> / 50 KB
      <div class="size-bar"><div class="size-fill" id="size-fill" style="width:0%"></div></div>
    </div>

    <!-- Generate -->
    <button class="generate-btn" id="generate-btn" disabled>Upload a photo to start</button>

  </div>

  <!-- Preview -->
  <div class="preview-panel">
    <div class="preview-label">Live Preview</div>
    <div class="preview-frame" id="preview-frame">
      <div class="preview-empty">
        <div class="preview-empty-icon">&#127748;</div>
        <div class="preview-empty-text">Your Linsta post will<br>appear here</div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  // State
  var originalImage = null; // raw Image element
  var cropMode = 'original';
  var currentFilter = 'none';
  var currentStyle = 'classic';
  var quality = 75;
  var MAX_DIM = 480;

  // DOM
  var uploadZone = document.getElementById('upload-zone');
  var fileInput = document.getElementById('file-input');
  var imageControls = document.getElementById('image-controls');
  var qualitySlider = document.getElementById('quality-slider');
  var qualityValue = document.getElementById('quality-value');
  var captionInput = document.getElementById('caption');
  var authorInput = document.getElementById('author');
  var charCount = document.getElementById('char-count');
  var previewFrame = document.getElementById('preview-frame');
  var generateBtn = document.getElementById('generate-btn');
  var sizeEstimate = document.getElementById('size-estimate');
  var sizeValue = document.getElementById('size-value');
  var sizeFill = document.getElementById('size-fill');

  // ── Upload ──
  uploadZone.addEventListener('click', function() { fileInput.click(); });

  uploadZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });

  uploadZone.addEventListener('dragleave', function() {
    uploadZone.classList.remove('dragover');
  });

  uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', function() {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        originalImage = img;
        uploadZone.classList.add('has-image');
        uploadZone.innerHTML = '<img src="' + e.target.result + '">';
        imageControls.classList.add('visible');
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Lint';
        sizeEstimate.style.display = 'block';
        updatePreview();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── Crop ──
  document.querySelectorAll('.crop-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.crop-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      cropMode = btn.dataset.crop;
      updatePreview();
    });
  });

  // ── Quality ──
  qualitySlider.addEventListener('input', function() {
    quality = parseInt(qualitySlider.value);
    qualityValue.textContent = quality + '%';
    updatePreview();
  });

  // ── Filter ──
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      updatePreview();
    });
  });

  // ── Style ──
  document.querySelectorAll('.style-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.style-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
      updatePreview();
    });
  });

  // ── Caption & Author ──
  captionInput.addEventListener('input', function() {
    charCount.textContent = captionInput.value.length;
    updatePreview();
  });

  authorInput.addEventListener('input', updatePreview);

  // ── Process Image ──
  function processImage() {
    if (!originalImage) return null;

    var sw = originalImage.width;
    var sh = originalImage.height;
    var sx = 0, sy = 0, cw = sw, ch = sh;

    // Crop
    if (cropMode === '1:1') {
      var side = Math.min(sw, sh);
      sx = (sw - side) / 2;
      sy = (sh - side) / 2;
      cw = ch = side;
    } else if (cropMode === '4:5') {
      var targetH = sw * (5 / 4);
      if (targetH <= sh) {
        sy = (sh - targetH) / 2;
        cw = sw; ch = targetH;
      } else {
        var targetW = sh * (4 / 5);
        sx = (sw - targetW) / 2;
        cw = targetW; ch = sh;
      }
    } else if (cropMode === '16:9') {
      var targetH9 = sw * (9 / 16);
      if (targetH9 <= sh) {
        sy = (sh - targetH9) / 2;
        cw = sw; ch = targetH9;
      } else {
        var targetW9 = sh * (16 / 9);
        sx = (sw - targetW9) / 2;
        cw = targetW9; ch = sh;
      }
    }

    // Scale
    var scale = Math.min(MAX_DIM / cw, MAX_DIM / ch, 1);
    var dw = Math.round(cw * scale);
    var dh = Math.round(ch * scale);

    var canvas = document.createElement('canvas');
    canvas.width = dw;
    canvas.height = dh;
    var ctx = canvas.getContext('2d');

    // Apply filter via CSS filter on canvas
    var filterCSS = getFilterCSS(currentFilter);
    ctx.filter = filterCSS;
    ctx.drawImage(originalImage, sx, sy, cw, ch, 0, 0, dw, dh);
    ctx.filter = 'none';

    // Fade overlay
    if (currentFilter === 'fade') {
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(0, 0, dw, dh);
    }
    if (currentFilter === 'noir') {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(0, 0, dw, dh);
    }

    return canvas.toDataURL('image/jpeg', quality / 100);
  }

  function getFilterCSS(f) {
    switch(f) {
      case 'warm': return 'saturate(1.1) sepia(0.15) brightness(1.05)';
      case 'cool': return 'saturate(0.9) hue-rotate(15deg) brightness(1.02)';
      case 'bw': return 'grayscale(1) contrast(1.1)';
      case 'sepia': return 'sepia(0.6) contrast(1.05)';
      case 'vivid': return 'saturate(1.5) contrast(1.1) brightness(1.05)';
      case 'fade': return 'contrast(0.85) saturate(0.8) brightness(1.1)';
      case 'noir': return 'grayscale(1) contrast(1.4) brightness(0.9)';
      default: return 'none';
    }
  }

  // ── Update Preview ──
  var previewDebounce;
  function updatePreview() {
    clearTimeout(previewDebounce);
    previewDebounce = setTimeout(doUpdatePreview, 80);
  }

  function doUpdatePreview() {
    if (!originalImage) return;

    var dataUrl = processImage();
    var caption = captionInput.value || '';
    var author = authorInput.value || '';
    var today = new Date();
    var dateStr = today.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

    // Remove old style classes
    previewFrame.className = 'preview-frame';
    if (currentStyle !== 'classic') {
      previewFrame.classList.add('style-' + currentStyle);
    }

    var html = '<div class="post-image-wrap"><img src="' + dataUrl + '"></div>';
    html += '<div class="post-body">';
    if (author) html += '<div class="post-author">' + escapeHtml(author) + '</div>';
    if (caption) html += '<div class="post-caption">' + escapeHtml(caption) + '</div>';
    html += '<div class="post-date">' + dateStr + '</div>';
    html += '</div>';

    previewFrame.innerHTML = html;

    // Estimate size
    estimateSize(dataUrl);
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
  }

  function estimateSize(dataUrl) {
    // base64 data url → approximate bytes
    var base64 = dataUrl.split(',')[1] || '';
    var imgBytes = Math.round(base64.length * 0.75);
    var htmlBytes = 2500; // approximate HTML template overhead
    var totalKB = Math.round((imgBytes + htmlBytes) / 1024);
    var pct = Math.min(100, Math.round((totalKB / 50) * 100));

    sizeValue.textContent = totalKB + ' KB';
    sizeFill.style.width = pct + '%';
    sizeFill.style.background = pct > 90 ? '#D4583A' : pct > 70 ? '#D4A03A' : '#5A8F5C';

    if (totalKB > 48) {
      generateBtn.disabled = true;
      generateBtn.textContent = 'Too large — lower quality or crop tighter';
    } else {
      generateBtn.disabled = false;
      generateBtn.textContent = 'Generate Lint';
    }
  }

  // ── Generate Zip ──
  generateBtn.addEventListener('click', function() {
    if (!originalImage) return;

    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating...';

    setTimeout(function() {
      var dataUrl = processImage();
      var caption = captionInput.value || '';
      var author = authorInput.value || '';
      var today = new Date();
      var dateStr = today.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

      var lintHtml = buildLintHtml(dataUrl, caption, author, dateStr, currentStyle, currentFilter);
      var dappConf = buildDappConf(caption, author);

      var zip = new JSZip();
      zip.file('index.html', lintHtml);
      zip.file('dapp.conf', dappConf);

      zip.generateAsync({type: 'blob', compression: 'DEFLATE', compressionOptions: {level: 9}})
        .then(function(blob) {
          var safeName = (author || 'linsta-post').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 40);
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = safeName + '.zip';
          a.click();
          URL.revokeObjectURL(a.href);

          generateBtn.disabled = false;
          generateBtn.textContent = 'Generate Lint';
        });
    }, 50);
  });

  function buildLintHtml(dataUrl, caption, author, dateStr, style, filter) {
    var captionEsc = escapeHtml(caption).replace(/\n/g, '<br>');
    var authorEsc = escapeHtml(author);

    // Style-specific CSS
    var styleCSS = '';
    switch(style) {
      case 'polaroid':
        styleCSS = '.post{background:#fff;padding:14px 14px 44px;border-radius:3px;box-shadow:0 4px 20px rgba(0,0,0,0.1),0 0 0 1px rgba(0,0,0,0.03);max-width:440px;} .post img{border-radius:0;} .post-body{padding:14px 4px 0;text-align:center;} .post-caption{font-family:Georgia,serif;font-style:italic;font-size:15px;color:#1a1a18;}  .post-author,.post-date{display:none;}';
        break;
      case 'editorial':
        styleCSS = '.post{background:#fff;border:1px solid #1a1a18;border-radius:0;max-width:440px;} .post-body{padding:20px;border-top:3px solid #1a1a18;} .post-author{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;} .post-caption{font-family:Georgia,serif;font-size:17px;line-height:1.4;color:#1a1a18;} .post-date{margin-top:14px;padding-top:10px;border-top:1px solid #e5e0d8;}';
        break;
      case 'minimal':
        styleCSS = '.post{background:transparent;box-shadow:none;border-radius:0;max-width:440px;} .post img{border-radius:10px;} .post-body{padding:12px 2px;} .post-caption{font-size:13px;color:#9e9b94;}';
        break;
      case 'film':
        styleCSS = 'body{background:#111!important;} .post{background:#1a1a18;border-radius:3px;padding:4px;max-width:440px;} .post img{border-radius:2px;} .post-body{padding:12px 10px;} .post-author{color:#c8c1b6;font-size:11px;} .post-caption{color:#9e9b94;font-size:13px;} .post-date{color:#5c5a55;}';
        break;
      case 'stamp':
        styleCSS = '.post{background:#fffefb;border:2px dashed #e5e0d8;border-radius:3px;padding:10px;max-width:440px;} .post img{border-radius:2px;} .post-body{padding:12px 4px 4px;text-align:center;} .post-caption{font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}';
        break;
      default:
        styleCSS = '.post{background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.08);overflow:hidden;max-width:440px;}';
    }

    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1.0">\n<title>' + escapeHtml(caption.substring(0, 60) || 'Linsta Post') + '</title>\n' +
      '<script src="../../miniweb/mds.js"><\/script>\n' +
      '<script src="../../miniweb/miniweb.js"><\/script>\n' +
      '<style>\n' +
      '@import url("../../miniweb/fonts/fonts.css");\n' +
      '*{margin:0;padding:0;box-sizing:border-box;}\n' +
      'body{font-family:Manrope,system-ui,sans-serif;background:#faf8f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased;}\n' +
      '.post img{width:100%;display:block;}\n' +
      '.post-body{padding:18px;}\n' +
      '.post-author{font-size:13px;font-weight:700;color:#1a1a18;margin-bottom:5px;}\n' +
      '.post-caption{font-size:14px;line-height:1.55;color:#5c5a55;}\n' +
      '.post-date{font-size:10px;color:#9e9b94;margin-top:10px;text-transform:uppercase;letter-spacing:0.5px;}\n' +
      styleCSS + '\n' +
      '</style>\n</head>\n<body>\n' +
      '<div class="post">\n' +
      '<img src="' + dataUrl + '" alt="Linsta post">\n' +
      '<div class="post-body">\n' +
      (authorEsc ? '<div class="post-author">' + authorEsc + '</div>\n' : '') +
      (captionEsc ? '<div class="post-caption">' + captionEsc + '</div>\n' : '') +
      '<div class="post-date">' + dateStr + '</div>\n' +
      '</div>\n</div>\n' +
      '<script>if(typeof miniweb_Init==="function")miniweb_Init();if(typeof MDS!=="undefined"&&MDS.init)MDS.init(function(){});<\/script>\n' +
      '</body>\n</html>';
  }

  function buildDappConf(caption, author) {
    var desc = caption ? caption.substring(0, 100) : 'A Linsta post';
    if (author) desc = author + ': ' + desc;
    return JSON.stringify({
      name: 'Linsta Post',
      icon: '',
      version: '1.0',
      description: desc
    }, null, 2) + '\n';
  }

})();
</script>
